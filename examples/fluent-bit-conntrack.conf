# Add to Fluent Bit main config with:
# @INCLUDE /etc/fluent-bit/fluent-bit-conntrack.conf
# Do not paste real credentials into a Git repository.
[INPUT]
    Name tcp
    Tag conntrack.agg
    Listen 127.0.0.1
    Port 5516
    Format json
    Buffer_Size 64KB
    Mem_Buf_Limit 4MB

[OUTPUT]
    Name opensearch
    Match conntrack.agg
    Host opensearch.example.com
    Port 9200
    Index conntrack-agg
    HTTP_User fluent_user
    HTTP_Passwd REPLACE_WITH_SECRET
    TLS On
    TLS.Verify On
    Logstash_Format On
    Logstash_Prefix conntrack-agg
    Time_Key @timestamp
    Generate_ID On
    Suppress_Type_Name On
    Replace_Dots On
    Logstash_DateFormat %Y.%m.%d
