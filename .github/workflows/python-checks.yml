name: Python checks

on:
  push:
    branches:
      - docs/bilingual-beta
      - release/beta-preparation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q -f flow_collector.py flow_lifecycle.py flow_opensearch.py flow_writer.py dns_resolver.py aggregator.py
      - name: Unit tests
        run: python -m unittest -v test_dns_resolver test_flow_lifecycle test_flow_opensearch test_flow_writer test_flow_collector test_aggregator
